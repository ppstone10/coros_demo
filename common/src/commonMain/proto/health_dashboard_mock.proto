syntax = "proto3";
package training.health;

// 仅用于脱敏、本地 mock 健康首页，不包含真实服务端字段或协议。

enum HealthMockScenarioCode {
  HEALTH_MOCK_SCENARIO_UNSPECIFIED = 0;
  HEALTH_MOCK_SCENARIO_NORMAL = 1;
  HEALTH_MOCK_SCENARIO_PARTIAL_MISSING = 2;
  HEALTH_MOCK_SCENARIO_ALL_EMPTY = 3;
  HEALTH_MOCK_SCENARIO_ABNORMAL = 4;
  HEALTH_MOCK_SCENARIO_READ_FAILURE = 5;
}

enum HealthMockErrorCode {
  HEALTH_MOCK_ERROR_UNSPECIFIED = 0;
  HEALTH_MOCK_ERROR_AUTH_REQUIRED = 1;
  HEALTH_MOCK_ERROR_EMPTY_DATA = 2;
  HEALTH_MOCK_ERROR_CORRUPTED_DATA = 3;
  HEALTH_MOCK_ERROR_READ_FAILED = 4;
  HEALTH_MOCK_ERROR_PERSIST_FAILED = 5;
  HEALTH_MOCK_ERROR_MINIMUM_CARDS_REQUIRED = 6;
}

message HealthMockError {
  HealthMockErrorCode code = 1;
  string message_key = 2;
}

message DailySummaryMock { optional int32 steps = 1; optional int32 calories = 2; optional int32 active_minutes = 3; }
message TodayActivityMock { optional double distance_km = 1; optional int32 pace_seconds_per_km = 2; optional string activity_name_key = 3; optional int32 training_load = 4; }
message SleepStageSegmentMock { string stage = 1; int32 start_minute = 2; int32 duration_minutes = 3; }
message SleepSummaryMock {
  optional int32 duration_minutes = 1; optional int32 quality_score = 2;
  optional string start_time = 3; optional string end_time = 4; repeated SleepStageSegmentMock stages = 5;
}
message TrainingLoadMock {
  optional int32 value = 1; optional int32 recommended_min = 2; optional int32 recommended_max = 3;
  repeated int32 daily_loads = 4;
}
message RecoveryMock { optional int32 score = 1; optional int32 remaining_hours = 2; }
message WeeklyDayPlanMock {
  int32 day_index = 1; optional string workout_name_key = 2;
  optional int32 workout_duration_minutes = 3; optional int32 workout_training_load = 4;
}
message WeeklyPlanMock {
  optional bool has_plan = 1; optional int32 planned_minutes = 2; optional string description = 3;
  optional int32 current_day_index = 4; repeated int32 daily_loads = 5; optional string workout_name_key = 6;
  optional int32 workout_duration_minutes = 7; optional int32 workout_training_load = 8;
  repeated WeeklyDayPlanMock day_plans = 9;
}
message TrainingAssessmentMock {
  optional int32 volume_score = 1; optional string trend = 2; optional int32 short_term_load = 3;
  optional int32 long_term_load = 4; optional double load_ratio = 5; optional string assessment_key = 6;
  optional string explanation_key = 7;
}
message RunningAbilityMock { optional int32 vo2max = 1; optional int32 score = 2; optional double display_score = 3; optional int32 marathon_seconds = 4; }
message CyclingAbilityMock { optional int32 ftp = 1; optional int32 score = 2; optional double display_score = 3; optional string ability_label_key = 4; }
message HeartRateIntervalMock {
  int32 start_minute = 1; int32 minimum = 2; int32 maximum = 3; int32 average = 4;
}
message HeartRateMock {
  optional int32 resting_hr = 1; optional int32 current_hr = 2; optional int32 average_hr = 3;
  repeated int32 samples = 4; // 旧快照兼容；新数据使用 intervals。
  repeated HeartRateIntervalMock intervals = 5;
  repeated int32 five_minute_samples = 6;
}
message StressMock { optional int32 stress_level = 1; optional string status = 2; optional int32 average_stress = 3; repeated int32 samples = 4; }
message HrvAssessmentMock { optional int32 hrv_score = 1; optional string status = 2; optional int32 average_ms = 3; optional int32 normal_min = 4; optional int32 normal_max = 5; }
message RestingHeartRateMock { optional int32 value = 1; optional string measured_time = 2; optional int32 thirty_day_average = 3; optional int32 range_min = 4; optional int32 range_max = 5; }
message HealthCheckMock {
  optional int32 overall_score = 1; optional int32 last_check_days = 2; optional string measured_time = 3;
  optional int32 heart_rate = 4; optional int32 hrv_ms = 5; optional int32 stress = 6;
  optional int32 respiratory_rate = 7; optional int32 blood_oxygen = 8;
}
message BodyManagementMock {
  optional double weight_kg = 1;
  optional double body_fat = 2;
  optional double bmi = 3;
  optional string measured_date = 4;
  repeated string trained_muscle_groups = 5;
  repeated double weight_history_kg = 6;
}

// Normal 可编辑场景与新版快照共用的最小源字段。
message DailySummaryInputMock { int32 steps = 1; int32 calories = 2; int32 active_minutes = 3; }
message TodayActivityInputMock { double distance_km = 1; int32 pace_seconds_per_km = 2; }
message WeeklyWorkoutInputMock { string type = 1; double distance_km = 2; }
message WeeklyPlanInputMock { repeated WeeklyWorkoutInputMock days = 1; }
message TrainingLoadInputMock { repeated int32 daily_loads = 1; }
message TrainingAssessmentInputMock { int32 short_term_load = 1; int32 long_term_load = 2; }
message ScoreInputMock { int32 score = 1; }
message HeartRateInputMock { repeated int32 five_minute_samples = 1; }
message StressInputMock { repeated int32 half_hour_samples = 1; }
message SleepStageInputMock { string stage = 1; int32 start_minute = 2; int32 duration_minutes = 3; }
message SleepInputMock { int32 start_minute_of_day = 1; repeated SleepStageInputMock stages = 2; }
message HrvAssessmentInputMock { int32 average_ms = 1; }
message RestingHeartRateInputMock { int32 value = 1; string measured_time = 2; int32 thirty_day_average = 3; }
message HealthCheckInputMock {
  int32 heart_rate = 1; int32 hrv_ms = 2; int32 stress = 3;
  int32 respiratory_rate = 4; int32 blood_oxygen = 5; string measured_time = 6;
}
message BodyManagementInputMock {
  double weight_kg = 1; repeated string trained_muscle_groups = 2; repeated double weight_history_kg = 3;
}
message EditableHealthDataMock {
  DailySummaryInputMock daily_summary = 1;
  TodayActivityInputMock today_activity = 2;
  WeeklyPlanInputMock weekly_plan = 3;
  TrainingLoadInputMock training_load = 4;
  TrainingAssessmentInputMock assessment = 5;
  ScoreInputMock recovery = 6;
  ScoreInputMock running_ability = 7;
  ScoreInputMock cycling_ability = 8;
  HeartRateInputMock heart_rate = 9;
  StressInputMock stress = 10;
  SleepInputMock sleep = 11;
  HrvAssessmentInputMock hrv_assessment = 12;
  RestingHeartRateInputMock resting_heart_rate = 13;
  HealthCheckInputMock health_check = 14;
  BodyManagementInputMock body_management = 15;
}

message HealthDashboardMock {
  DailySummaryMock daily = 1; SleepSummaryMock sleep = 2; TrainingLoadMock training_load = 3; RecoveryMock recovery = 4;
  WeeklyPlanMock weekly_plan = 5; TrainingAssessmentMock training_assessment = 6;
  RunningAbilityMock running_ability = 7; CyclingAbilityMock cycling_ability = 8;
  HeartRateMock heart_rate = 9; StressMock stress = 10; HrvAssessmentMock hrv_assessment = 11;
  RestingHeartRateMock resting_heart_rate = 12; HealthCheckMock health_check = 13; BodyManagementMock body_management = 14;
  TodayActivityMock today_activity = 15;
}
message HealthDashboardSnapshotMock {
  string user_id = 1;
  // 旧二进制/JSON 字符串场景兼容位；新快照写入字段 6。
  string legacy_scenario = 2 [deprecated = true];
  repeated string enabled_card_types = 3;
  HealthDashboardMock dashboard_data = 4;
  int32 schema_version = 5;
  // 仅作为 Demo 数据模板来源元数据；恢复时以 dashboard_data 为权威。
  HealthMockScenarioCode scenario = 6;
  optional HealthMockError error = 7;
  // schema v7：Normal 场景以最小源字段为权威；与 dashboard_data 互斥。
  EditableHealthDataMock editable_data = 8;
}

message HealthDashboardStoreMock { repeated HealthDashboardSnapshotMock snapshots = 1; }
